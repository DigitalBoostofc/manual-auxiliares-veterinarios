<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aula de plantão · Auxiliar veterinário</title>
  <meta name="description" content="Mapa do plantão: toque uma estação e treine uma ideia por vez." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230c1c1b' width='32' height='32'/%3E%3Ccircle cx='10' cy='16' r='2' fill='%23c9a56a'/%3E%3Ccircle cx='22' cy='16' r='2' fill='%232f8f82'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ground: #0c1c1b;
      --ground-2: #101a19;
      --ink: #f4efe4;
      --ink-2: #b7b3a8;
      --muted: #6c7378;
      --amber: #c9a56a;
      --teal: #2f8f82;
      --hair: rgba(244, 239, 228, .13);
      --nav: 58px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: Sora, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; color: inherit; }
    .display { font-family: Syne, sans-serif; font-weight: 800; letter-spacing: -.025em; line-height: .92; }
    .label {
      font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
    .label.amber { color: var(--amber); }
    .label.teal { color: var(--teal); }

    nav.bar {
      position: fixed; inset: 0 0 auto; height: var(--nav); z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 0 max(12px, env(safe-area-inset-left));
      background: var(--ground);
      border-bottom: 1px solid var(--hair);
    }
    .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .brand img { height: 28px; width: auto; max-width: none; border-radius: 6px; }
    .word { font-family: Syne, sans-serif; font-weight: 800; font-size: 13px; letter-spacing: -.02em; text-transform: uppercase; }
    .amp { color: var(--amber); }
    .bar nav { display: none; }
    .bar nav.open {
      display: flex; flex-direction: column; position: fixed;
      top: var(--nav); left: 0; right: 0; padding: 8px 16px 20px;
      background: var(--ground); border-bottom: 1px solid var(--hair);
      max-height: calc(100vh - var(--nav)); overflow: auto; z-index: 110;
    }
    .bar nav.open a { padding: 14px 0; border-bottom: 1px solid var(--hair); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .menu {
      margin-left: auto; background: none; border: 1px solid var(--hair);
      color: var(--ink); font-size: 10.5px; letter-spacing: .14em;
      text-transform: uppercase; cursor: pointer;
      min-width: 44px; min-height: 44px; padding: 0 12px;
    }
    .pill {
      font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; padding: 8px 10px;
      border: 1px solid var(--hair); background: transparent; cursor: pointer; color: var(--ink);
    }
    .pill:hover, .pill.on { border-color: var(--amber); color: var(--amber); }

    .map {
      padding: calc(var(--nav) + 20px) 6vw 40px;
      max-width: 1080px; margin: 0 auto;
    }
    .map h1 { font-size: clamp(36px, 11vw, 64px); margin: 8px 0 10px; }
    .map .lede { color: var(--ink-2); max-width: 34ch; font-size: 17px; margin-bottom: 28px; }
    .stops {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .stop {
      position: relative; aspect-ratio: 4 / 5; overflow: hidden;
      border: 1px solid var(--hair); background: var(--ground-2);
      color: var(--ink); text-align: left; cursor: pointer;
      min-height: 0; padding: 0;
    }
    .stop img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: .48;
    }
    .stop::after {
      content: ""; position: absolute; inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(12,28,27,.92));
      pointer-events: none;
    }
    .stop .meta { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 1; }
    .stop .n { display: block; font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(28px, 8vw, 42px); color: var(--amber); letter-spacing: -.04em; line-height: .9; margin-bottom: 4px; }
    .stop.quiz .n { color: var(--teal); }
    .stop .t { font-size: 15px; font-weight: 500; }
    .stop.done { border-color: var(--teal); }
    .stop .ok {
      position: absolute; top: 10px; right: 10px; z-index: 1;
      width: 8px; height: 8px; border-radius: 50%; background: var(--teal);
      display: none;
    }
    .stop.done .ok { display: block; }
    .map-foot {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--hair);
      font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }

    .story {
      position: fixed; inset: 0; z-index: 120;
      display: none; flex-direction: column;
      background: var(--ground);
    }
    .story.on { display: flex; }
    .story-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      padding: 10px max(12px, env(safe-area-inset-left));
      background: linear-gradient(rgba(12,28,27,.72), transparent);
    }
    .story-top .count { margin-left: auto; color: var(--amber); }
    .photo {
      position: relative; flex: 1; min-height: 0;
      touch-action: pan-x;
    }
    .photo img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .photo::after {
      content: ""; position: absolute; inset: 40% 0 0;
      background: linear-gradient(transparent, var(--ground));
      pointer-events: none;
    }
    .panel {
      flex: 0 0 auto;
      padding: 8px 6vw calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--hair);
      background: var(--ground);
    }
    .panel h2 { font-size: clamp(26px, 7vw, 36px); margin: 6px 0 10px; max-width: 16ch; }
    .panel h2 em { font-style: normal; color: var(--amber); }
    .panel .lead { color: var(--ink-2); font-size: 16px; max-width: 38ch; margin-bottom: 16px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .pair button {
      min-height: 48px; border: 1px solid var(--hair); background: transparent;
      cursor: pointer; font-size: 15px; font-weight: 600;
    }
    .pair .do { color: var(--teal); border-color: var(--teal); }
    .pair .no { color: var(--amber); }
    .pair button.on { background: rgba(201,165,106,.08); }
    .dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); display: block; }
    .dots i.on { background: var(--amber); }

    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
      max-height: 48vh; overflow: auto;
      background: var(--ground-2);
      border-top: 1px solid var(--amber);
      padding: 16px 6vw calc(18px + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    .sheet.on { transform: none; }
    .sheet h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 10px; }
    .sheet.do h3 { color: var(--teal); }
    .sheet ul { margin: 0 0 0 18px; color: var(--ink-2); }
    .sheet li { margin: 7px 0; }
    .sheet p { color: var(--ink-2); }
    .sheet .src { font-size: 12px; color: var(--muted); margin-top: 10px; }

    .opts { display: grid; gap: 8px; margin-bottom: 12px; }
    .opts button {
      text-align: left; background: transparent; border: 1px solid var(--hair);
      padding: 12px 14px; cursor: pointer; font-size: 15px; min-height: 44px;
    }
    .opts button.good { border-color: var(--teal); color: var(--teal); }
    .opts button.bad { opacity: .55; }
    .why { display: none; color: var(--ink-2); font-size: 14px; margin-bottom: 12px; }
    .why.show { display: block; }
    .why b { color: var(--amber); font-weight: 600; }

    .next-row { display: flex; gap: 10px; margin-bottom: 14px; }
    .next-row .pill { flex: 1; text-align: center; min-height: 44px; }

    @media (min-width: 900px) {
      .brand img { height: 34px; }
      .word { font-size: 15px; }
      .menu { display: none; }
      .bar { padding: 0 22px; gap: 28px; }
      .bar nav { display: flex; gap: 16px; flex: 1; overflow-x: auto; }
      .bar nav a { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
      .bar nav a:hover { color: var(--amber); }
      .bar > .pill { margin-left: auto; }
      .stops { grid-template-columns: repeat(4, 1fr); }
      .story { max-width: 480px; left: auto; right: 0; border-left: 1px solid var(--hair); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sheet { transition: none; }
    }
  </style>
</head>
<body>
  <nav class="bar">
    <a class="brand" href="#mapa">
      <img src="assets/logo.png" alt="ONG Amigo Bicho" width="405" height="210" />
      <span class="word">Aula<span class="amp">.</span></span>
    </a>
    <nav id="links"></nav>
    <button class="menu" type="button" id="menu">Menu</button>
    <a class="pill" href="calculadora.html">Calculadora</a>
  </nav>

  <main class="map" id="mapa">
    <p class="label amber">ONG Amigo Bicho</p>
    <h1 class="display">Mapa do<br> plantão.</h1>
    <p class="lede">Toque uma estação. Lá dentro, uma tela — uma ideia. Remédio e diagnóstico: pare e chame.</p>
    <div class="stops" id="stops"></div>
    <div class="map-foot">
      <button class="pill" type="button" id="fontesBtn">Fontes</button>
      <span>CFMV 1.260/2019</span>
      <a class="pill" href="calculadora.html">Conta da ampola</a>
    </div>
  </main>

  <div class="story" id="story" aria-hidden="true">
    <div class="photo" id="photo">
      <img id="photoImg" alt="" />
      <div class="story-top">
        <button class="pill" type="button" id="back">Mapa</button>
        <span class="label amber" id="kicker">01 · Papel</span>
        <span class="label count" id="count">1 / 4</span>
      </div>
    </div>
    <div class="panel" id="panel"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    const stations = [
      {
        id: "papel", n: "01", name: "Chegada & Papel", img: "assets/team.jpg",
        slides: [
          { img: "assets/team.jpg", kicker: "01 · Papel", title: "Você ajuda.<br><em>O vet decide.</em>", lead: "Apoio, debaixo de orientação. Diagnóstico ou remédio: pare e chame.",
            do: ["Receber o animal e fazer a triagem inicial.", "Medir e anotar temperatura, coração, respiração, gengiva e TPC.", "Conter com calma, só o necessário.", "Ajudar nos primeiros socorros e a preparar material.", "Anotar horário, o que mudou e o que foi feito."],
            dont: ["Dizer o diagnóstico ou o prognóstico.", "Escolher, mudar ou passar remédio e dose.", "Decidir a velocidade do soro.", "Sedação ou procedimento invasivo sem ordem.", "Alta, atestado ou decisão de operar."] },
          { img: "assets/hero.jpg", kicker: "01 · Chegada", title: "Sala segura?", lead: "Gente o bastante. Fale baixo. Peça ajuda antes de tocar.",
            do: ["Olhe a sala e o animal antes de chegar perto.", "Peça ajuda se faltar gente.", "Fale baixo."],
            dont: ["Não avance sozinho se puder morder ou fugir.", "Não force pose que piora a lesão."] }
        ]
      },
      {
        id: "abcde", n: "02", name: "ABCDE", img: "assets/oxygen.jpg",
        slides: [
          { img: "assets/oxygen.jpg", kicker: "02 · A", title: "O ar entra?", lead: "Boca, pescoço, vômito, secreção. Em trauma, isso vem antes da fratura.",
            do: ["Olhe a via aérea.", "Tire só o que você alcança, sem enfiar nada no escuro.", "Se o pescoço pode ter quebrado, mantenha alinhado."],
            dont: ["Não atrase o ABCDE por causa da pata.", "Não enfie o dedo no escuro."] },
          { img: "assets/vitals.jpg", kicker: "02 · B", title: "Respira bem?", lead: "Conte, veja o esforço e a cor da gengiva. Gato de boca aberta é emergência.",
            do: ["Oxigênio conforme o protocolo, sem estressar.", "Deixe na pose em que ele respira melhor."],
            dont: ["Não force o gato em crise com máscara.", "Não deite à força."] },
          { img: "assets/gums.jpg", kicker: "02 · C", title: "Circula?", lead: "Gengiva, TPC, pulso, pata fria. Pálida ou TPC lento: chame agora.",
            do: ["Anote cor + TPC + horário.", "Prepare a veia se o veterinário pedir."],
            dont: ["Não dê anti-inflamatório no choque.", "Não ignore pulso fraco só porque ele ainda anda."] },
          { img: "assets/catgums.jpg", kicker: "02 · D", title: "Acordado?", lead: "Pose, convulsão, trauma de cabeça. Mexa pouco se suspeitar de coluna.",
            do: ["Olhe se está acordado e se a pose mudou.", "Mantenha alinhado se houver trauma de pescoço."],
            dont: ["Não teste se “sente” várias vezes."] },
          { img: "assets/press.jpg", kicker: "02 · E", title: "Ferida, frio?", lead: "Cubra a ferida. Proteja do frio e do calor demais.",
            do: ["Procure ferida, osso torto, sangue, frio ou calor.", "Cubra com material limpo."],
            dont: ["Não trate a pata isolada do resto do corpo."] }
        ]
      },
      {
        id: "vitais", n: "03", name: "Sinais vitais", img: "assets/vitals.jpg",
        slides: [
          { img: "assets/vitals.jpg", kicker: "03 · Tendência", title: "O número sozinho quase não serve.", lead: "Anote com horário. O que importa: está piorando?",
            do: ["Anote valor + horário + o que foi feito.", "Compare com a medição anterior."],
            dont: ["Não confie num valor ‘normal’ isolado.", "Não esqueça: medo e dor também sobem coração e respiração."] },
          { img: "assets/vitals.jpg", kicker: "03 · Temp", title: "37,8–39,2 °C", lead: "Reto. Medo e tamanho mudam o número.",
            do: ["Anote valor + horário + como mediu.", "Lubrifique. Se reagir muito, pare."],
            dont: ["Não ignore febre ou hipotermia com outro sinal."] },
          { img: "assets/gums.jpg", kicker: "03 · TPC", title: "Rosada. TPC &lt; 2 s.", lead: "Pálida, roxa ou TPC de 3 s: choque. Chame agora.",
            do: ["Anote cor + TPC + horário.", "Olhe também o pulso."],
            dont: ["Não espere ele parar de andar para avisar."] },
          { img: "assets/oxygen.jpg", kicker: "03 · Ordem", title: "Meça nesta ordem.", lead: "Respiração (sem tocar) → coração → gengiva → temperatura → de novo.",
            do: ["Respiração antes de tocar.", "Meça de novo no intervalo que o veterinário pedir."],
            dont: ["Não comece pela temperatura se ele já está em falta de ar."] }
        ]
      },
      {
        id: "trauma", n: "04", name: "Trauma", img: "assets/splint.jpg",
        slides: [
          { img: "assets/splint.jpg", kicker: "04 · Trauma", title: "Não é só o osso.", lead: "O mesmo tombo pode ter machucado por dentro. Não trate a pata isolada.",
            do: ["Olhe o corpo inteiro: peito, barriga, coluna, xixi.", "ABCDE primeiro."],
            dont: ["Não conclua que está bem só porque anda.", "Não ignore aparência ‘discreta’."] },
          { img: "assets/gums.jpg", kicker: "04 · O que você vê", title: "Manca. Incha. Dói.", lead: "Pose estranha, ferida por cima. Não provoque estalo para testar.",
            do: ["Anote o que você vê e o horário.", "Pense também em coluna, peito, sangramento interno."],
            dont: ["Não fique testando a fratura."] }
        ]
      },
      {
        id: "fratura", n: "05", name: "Fratura", img: "assets/press.jpg",
        slides: [
          { img: "assets/splint.jpg", kicker: "05 · Fratura", title: "Não coloque o osso no lugar.", lead: "A tala agora é para deixar quieto — não para consertar.",
            do: ["Deixe o mais quieto possível.", "Cubra se houver ferida.", "Olhe a ponta: cor, calor, pulso.", "Ajude na tala só se for pedido."],
            dont: ["Não puxe para alinhar.", "Não aperte a tala nem esconda os dedos.", "Não dê remédio por conta."] },
          { img: "assets/press.jpg", kicker: "05 · Osso para fora", title: "Cubra. Não empurre.", lead: "Segure o sangue por fora. Chame com urgência.",
            do: ["Gaze limpa por cima.", "Controle o sangue sem apertar demais a circulação."],
            dont: ["Não empurre o osso para dentro.", "Não lave com álcool no osso sem ordem."] }
        ]
      },
      {
        id: "coluna", n: "06", name: "Coluna", img: "assets/spine.jpg",
        slides: [
          { img: "assets/spine.jpg", kicker: "06 · Coluna", title: "Mova em bloco.", lead: "Não anda, pernas moles, dor no pescoço ou nas costas: pense em coluna.",
            do: ["Tábua, maca ou cobertor esticado.", "Mais de uma pessoa. Cabeça, pescoço e tronco alinhados."],
            dont: ["Não levante pelas patas.", "Não arraste pela coleira.", "Não peça para andar ‘para ver se melhora’.", "Não teste se ‘sente’ várias vezes."] }
        ]
      },
      {
        id: "feridas", n: "07", name: "Feridas", img: "assets/press.jpg",
        slides: [
          { img: "assets/press.jpg", kicker: "07 · Sangue", title: "Pressione. Gaze por cima.", lead: "Se encharcar, ponha outra — não tire a primeira.",
            do: ["Luvas. Gaze limpa, pressão direta.", "Anote onde é e quanto sangrou."],
            dont: ["Não tire a primeira gaze encharcada.", "Não ignore sangramento que não para."] },
          { img: "assets/gums.jpg", kicker: "07 · Objeto", title: "Não tire o objeto.", lead: "Furo pequeno por fora pode ser fundo por dentro. Andar não prova que está bem.",
            do: ["Estabilize para o transporte.", "Chame o veterinário."],
            dont: ["Não retire no local.", "Não jogue produto irritante em ferida funda sem ordem."] }
        ]
      },
      {
        id: "manejo", n: "08", name: "Dor & convulsão", img: "assets/cat.jpg",
        slides: [
          { img: "assets/cat.jpg", kicker: "08 · Manejo", title: "Acalme. Observe. Avise.", lead: "Quem escolhe o analgésico é o veterinário.",
            do: ["Voz baixa, chão que não escorrega, contenção curta.", "Cobertor se estiver frio. Calor indireto."],
            dont: ["Não ponha bolsa quente na pele.", "Não ponha gelo direto.", "Não dê analgésico por conta."] },
          { img: "assets/catgums.jpg", kicker: "08 · Convulsão", title: "Afaste. Conte o tempo.", lead: "Não ponha a mão na boca. Crise longa: chame na hora.",
            do: ["Afaste objetos, proteja a cabeça, conte o tempo.", "Anote início, duração, quantas crises.", "Glicemia, se houver aparelho."],
            dont: ["Não ponha a mão na boca.", "Não segure à força.", "Não ‘espere passar’ uma crise de vários minutos."] }
        ]
      },
      {
        id: "terapeutica", n: "09", name: "Terapêutica", img: "assets/still.jpg",
        slides: [
          { img: "assets/gums.jpg", kicker: "09 · Choque", title: "Ar e soro primeiro.", lead: "Gengiva pálida, frio, TPC lento. Anti-inflamatório agora faz mal ao rim.",
            do: ["Oxigênio sem forçar máscara no gato em crise.", "Acesso na veia, se o veterinário pedir.", "Aqueça e deixe quieto."],
            dont: ["Não dê anti-inflamatório no choque.", "Não infunda o soro ‘até o fim’ sem olhar de novo."],
            calc: "soro" },
          { img: "assets/splint.jpg", kicker: "09 · Dor", title: "Opioide µ. O vet escolhe.", lead: "Anti-inflamatório só quando já está estável.",
            do: ["Anote a dor antes e meia hora depois.", "Imobilizar o membro já diminui a necessidade de remédio."],
            dont: ["Não dê anti-inflamatório no choque ou junto com corticoide.", "Não misture dois anti-inflamatórios."],
            calc: "dor" },
          { img: "assets/spine.jpg", kicker: "09 · Coluna", title: "Corticoide alto não é rotina.", lead: "Mova em bloco. Analgesia. O veterinário titula o opioide.",
            do: ["Prancha ou cobertor, 3 a 4 pessoas.", "Avise se não faz xixi."],
            dont: ["Não dê corticoide ‘por protocolo’.", "Não teste dor profunda várias vezes."],
            calc: "dor" },
          { img: "assets/cat.jpg", kicker: "09 · Convulsão", title: "Benzodiazepínico com o vet.", lead: "Proteja, conte o tempo, meça glicose.",
            do: ["Anote início e duração.", "Glicemia, se houver aparelho."],
            dont: ["Não ponha a mão na boca.", "Não aplique diazepam por conta."],
            calc: "crise" }
        ]
      }
    ];

    const quiz = [
      { tag: "Trauma", q: "O animal chegou com a pata torta. Por que você ainda olha o corpo inteiro?",
        opts: ["Porque a fratura sempre é o problema mais grave.", "Porque o mesmo tombo pode ter machucado por dentro, mesmo sem aparecer.", "Porque todo mundo com fratura precisa de remédio na hora.", "Porque você deve endireitar o osso antes do raio-x."],
        a: 1, why: "O trauma de alta energia costuma ter várias lesões ao mesmo tempo. Primeiro estabilizar (ABCDE), depois o osso.",
        src: "Merck Veterinary Manual — Trauma in Emergency Medicine (2025/2026)." },
      { tag: "Trauma", q: "O animal anda depois do atropelamento. Isso prova que está bem?",
        opts: ["Sim. Se anda, não tem lesão grave.", "Não. Lesão interna pode aparecer horas depois.", "Sim, se a gengiva estiver rosada uma vez.", "Só se ele abanar o rabo."],
        a: 1, why: "Muitos danos internos só ficam claros depois. Internar para observar mesmo quem parece estável.",
        src: "Merck Veterinary Manual — delayed injury; hospitalize for monitoring." },
      { tag: "Coluna", q: "Qual conjunto de sinais faz você pensar em coluna?",
        opts: ["Só um dedo mancando.", "De repente não anda, pernas moles, dor forte no pescoço ou nas costas.", "Só febre.", "Gengiva rosada e TPC de 1 segundo."],
        a: 1, why: "Incapacidade súbita de andar, fraqueza, dor na coluna e perda de xixi/fezes pedem movimento em bloco.",
        src: "Merck Veterinary Manual — Trauma of the Spinal Column and Cord." },
      { tag: "Coluna", q: "Como você move um animal com suspeita de coluna?",
        opts: ["Pelas patas de trás, rápido.", "Em bloco, superfície firme, mais de uma pessoa, cabeça e tronco alinhados.", "Pela coleira, para controlar a cabeça.", "Deixa andar ‘para ver se melhora’."],
        a: 1, why: "Torção e puxão pelas patas podem piorar a medula. Tábua, maca ou cobertor esticado.",
        src: "Merck Veterinary Manual — First Aid and Transport; VetATLS." },
      { tag: "Fratura", q: "Para que serve a tala provisória?",
        opts: ["Para deixar o osso no lugar certo.", "Para diminuir o movimento e a dor até o veterinário avaliar.", "Para substituir a cirurgia.", "Para o animal poder caminhar no canil."],
        a: 1, why: "Imobilização provisória reduz movimento e dor. Não é redução da fratura.",
        src: "Merck Veterinary Manual — Bone Fractures; First Aid and Transport." },
      { tag: "Fratura", q: "Por que não se puxa o membro para ‘alinhar’?",
        opts: ["Porque dói em quem está segurando.", "Porque pode piorar a dor e machucar vaso, nervo e músculo.", "Porque o osso se arruma sozinho em dez minutos.", "Porque tala apertada resolve tudo."],
        a: 1, why: "Alinhar à força lesa partes moles, vasos e nervos. Prioridade: quietude e proteção.",
        src: "Merck Veterinary Manual — First Aid and Transport." },
      { tag: "Ferida", q: "Tem ferimento em cima de uma possível fratura. O que você faz?",
        opts: ["Empurra o osso para dentro e sutura.", "Cobre, segura o sangramento por fora, não suja mais e chama o veterinário.", "Lava com álcool e deixa ao ar.", "Dá um anti-inflamatório por conta própria."],
        a: 1, why: "Fratura aberta: cubra, controle o sangue por fora, não recoloque o osso. Antibiótico é do veterinário.",
        src: "Clinician’s Brief — Trauma medication therapies." },
      { tag: "Ferida", q: "Há um objeto cravado. Você tira no local?",
        opts: ["Sim, para limpar a ferida.", "Não. Estabilize o objeto e chame o veterinário.", "Só se for um graveto fino.", "Sim, se o animal estiver andando."],
        a: 1, why: "Retirar pode piorar o sangramento e o dano profundo.",
        src: "Merck Veterinary Manual — First Aid and Transport." },
      { tag: "ABCDE", q: "Quais sinais de respiração pedem o veterinário na hora?",
        opts: ["Um suspiro enquanto dorme.", "Muito esforço para respirar, gengiva roxa, gato de boca aberta.", "Cão calmo com 24 respirações por minuto.", "Ofegação depois de brincar, que já passou."],
        a: 1, why: "Dispneia, cianose e boca aberta no gato são emergência.",
        src: "Merck Veterinary Manual — Initial Triage and Resuscitation." },
      { tag: "ABCDE", q: "Em que ordem você olha o animal na chegada?",
        opts: ["Primeiro a fratura, depois o resto.", "A vias aéreas, B respiração, C circulação, D neurológico, E exposição.", "Primeiro a temperatura, sempre.", "Como o tutor pedir."],
        a: 1, why: "ABCDE é o padrão de emergência em pequenos animais.",
        src: "Merck Veterinary Manual — Initial Triage and Resuscitation." },
      { tag: "Convulsão", q: "Na convulsão, o que é seguro — e o que é proibido?",
        opts: ["Pôr a mão na boca e puxar a língua.", "Afastar objetos, proteger a cabeça, contar o tempo. Não pôr a mão na boca nem segurar à força.", "Amarrar as quatro patas e pôr gelo na cabeça.", "Dar diazepam por conta e filmar depois."],
        a: 1, why: "Você protege e cronometra. Remédio só com o veterinário. Mão na boca = mordida.",
        src: "Merck Veterinary Manual — emergency management of seizures." },
      { tag: "Convulsão", q: "Uma crise passa de 5 minutos. O que isso pede?",
        opts: ["Esperar mais 10 minutos em silêncio.", "Avisar o veterinário na hora: pode ser status. Glicemia se houver aparelho.", "Dar açúcar na boca à força.", "Banho frio."],
        a: 1, why: "Crise longa é emergência. O veterinário pode usar benzodiazepínico.",
        src: "Merck Veterinary Manual — Initial Triage (seizures; glucose)." },
      { tag: "Vitais", q: "Além do número, o que você anota?",
        opts: ["Só o nome do tutor.", "Horário, se está piorando ou melhorando, e o que foi feito.", "Nada, se o número parecer ‘normal’.", "Nada. O veterinário lembra."],
        a: 1, why: "Tendência com horário vale mais que um valor isolado.",
        src: "Merck Veterinary Manual — monitoring the critically ill small animal." },
      { tag: "Vitais", q: "TPC de 3 segundos e gengiva muito pálida. O que isso sugere?",
        opts: ["Que o animal está descansando.", "Má circulação / choque — chame o veterinário agora.", "Que a temperatura está normal.", "Nada, se ele ainda anda."],
        a: 1, why: "TPC em geral é até 2 s, gengiva rosada. TPC demorado e mucosa pálida apontam má perfusão.",
        src: "UC Davis CVET Normal Vital Signs (2026); Merck triage." },
      { tag: "Papel", q: "Quem escolhe o remédio e a dose?",
        opts: ["O auxiliar, se já viu o caso uma vez.", "Só o médico-veterinário. Você prepara e confere depois da ordem.", "O tutor, pelo WhatsApp.", "Qualquer um da equipe, se tiver pressa."],
        a: 1, why: "A Resolução CFMV 1.260/2019 coloca o auxiliar em apoio sob orientação. Prescrição não é sua.",
        src: "CFMV — Resolução nº 1.260/2019." }
    ];

    const quizStation = {
      id: "quiz", n: "10", name: "Quiz", img: "assets/still.jpg", quiz: true,
      slides: quiz.map((q, i) => ({
        img: "assets/still.jpg", kicker: "10 · Quiz", title: q.q, lead: q.tag,
        quiz: true, opts: q.opts, a: q.a, why: q.why, src: q.src, i
      }))
    };
    const all = [...stations, quizStation];

    const done = new Set(JSON.parse(localStorage.getItem("aula-done") || "[]"));
    const answers = {};
    const stops = document.getElementById("stops");
    const links = document.getElementById("links");
    const story = document.getElementById("story");
    const photoImg = document.getElementById("photoImg");
    const kicker = document.getElementById("kicker");
    const countEl = document.getElementById("count");
    const panel = document.getElementById("panel");
    const sheet = document.getElementById("sheet");
    let cur = null, idx = 0, sheetKind = null;

    all.forEach(s => {
      const a = document.createElement("button");
      a.type = "button";
      a.className = "stop" + (s.quiz ? " quiz" : "") + (done.has(s.id) ? " done" : "");
      a.dataset.id = s.id;
      a.innerHTML = `<img src="${s.img}" alt="" /><i class="ok"></i><span class="meta"><span class="n">${s.n}</span><span class="t">${s.name}</span></span>`;
      a.addEventListener("click", () => openStation(s.id, 0));
      stops.appendChild(a);
      const l = document.createElement("a");
      l.href = "#" + s.id;
      l.textContent = s.n + " · " + s.name;
      links.appendChild(l);
    });
    const homeLink = document.createElement("a");
    homeLink.href = "#mapa";
    homeLink.textContent = "Mapa";
    links.prepend(homeLink);

    function markDone(id) {
      done.add(id);
      localStorage.setItem("aula-done", JSON.stringify([...done]));
      const tile = stops.querySelector(`[data-id="${id}"]`);
      if (tile) tile.classList.add("done");
    }

    function openStation(id, i, setHash = true) {
      cur = all.find(s => s.id === id);
      if (!cur) return;
      idx = Math.max(0, Math.min(i || 0, cur.slides.length - 1));
      links.classList.remove("open");
      story.classList.add("on");
      story.setAttribute("aria-hidden", "false");
      if (window.matchMedia("(max-width: 899px)").matches) document.getElementById("mapa").style.display = "none";
      if (setHash && location.hash.slice(1) !== id) location.hash = id;
      draw();
    }
    function closeStory() {
      story.classList.remove("on");
      story.setAttribute("aria-hidden", "true");
      document.getElementById("mapa").style.display = "";
      sheet.classList.remove("on");
      cur = null;
      if (location.hash.slice(1) !== "mapa") location.hash = "mapa";
    }

    function draw() {
      const s = cur.slides[idx];
      photoImg.src = s.img;
      photoImg.alt = "";
      kicker.textContent = s.kicker;
      countEl.textContent = (idx + 1) + " / " + cur.slides.length;
      sheet.classList.remove("on");
      sheetKind = null;
      const dots = cur.slides.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("");
      if (s.quiz) {
        const picked = answers[s.i];
        const opts = s.opts.map((o, oi) => {
          let cls = "";
          if (picked != null) {
            if (oi === s.a) cls = "good";
            else if (oi === picked) cls = "bad";
          }
          return `<button type="button" data-o="${oi}" class="${cls}">${o}</button>`;
        }).join("");
        panel.innerHTML = `
          <p class="label amber">${s.lead}</p>
          <h2 class="display">${s.title}</h2>
          <div class="opts">${opts}</div>
          <p class="why ${picked != null ? "show" : ""}" id="whyBox">${picked != null ? `<b>Por quê.</b> ${s.why}<span class="src" style="display:block;margin-top:8px;color:var(--muted);font-size:12px">${s.src}</span>` : ""}</p>
          <div class="next-row">
            <button class="pill" type="button" data-nav="-1">Anterior</button>
            <button class="pill" type="button" data-nav="1">${idx === cur.slides.length - 1 ? "Mapa" : "Próxima"}</button>
          </div>
          <div class="dots">${dots}</div>`;
      } else {
        const calc = s.calc ? `<a class="pill" href="calculadora.html?sit=${s.calc}" style="display:block;text-align:center;margin-bottom:12px">Ver a conta</a>` : "";
        panel.innerHTML = `
          <h2 class="display">${s.title}</h2>
          <p class="lead">${s.lead}</p>
          <div class="pair">
            <button class="do" type="button" data-sheet="do">Faça</button>
            <button class="no" type="button" data-sheet="no">Não faça</button>
          </div>
          ${calc}
          <div class="next-row">
            <button class="pill" type="button" data-nav="-1">Anterior</button>
            <button class="pill" type="button" data-nav="1">${idx === cur.slides.length - 1 ? "Mapa" : "Próxima"}</button>
          </div>
          <div class="dots">${dots}</div>`;
      }
    }

    function go(d) {
      const n = idx + d;
      if (n < 0) { closeStory(); return; }
      if (n >= cur.slides.length) { markDone(cur.id); closeStory(); return; }
      idx = n;
      if (idx === cur.slides.length - 1) markDone(cur.id);
      draw();
    }

    function openSheet(kind) {
      const s = cur.slides[idx];
      if (sheetKind === kind) { sheet.classList.remove("on"); sheetKind = null; return; }
      sheetKind = kind;
      const list = kind === "do" ? s.do : s.dont;
      sheet.className = "sheet on " + kind;
      sheet.innerHTML = `<h3>${kind === "do" ? "Faça" : "Não faça"}</h3><ul>${list.map(x => `<li>${x}</li>`).join("")}</ul>`;
      panel.querySelectorAll(".pair button").forEach(b => b.classList.toggle("on", b.dataset.sheet === kind));
    }

    panel.addEventListener("click", e => {
      const nav = e.target.closest("[data-nav]");
      if (nav) { go(+nav.dataset.nav); return; }
      const sh = e.target.closest("[data-sheet]");
      if (sh) { openSheet(sh.dataset.sheet); return; }
      const opt = e.target.closest("[data-o]");
      if (opt && cur.slides[idx].quiz) {
        answers[cur.slides[idx].i] = +opt.dataset.o;
        draw();
      }
    });
    document.getElementById("back").addEventListener("click", closeStory);
    document.getElementById("menu").onclick = () => links.classList.toggle("open");
    links.addEventListener("click", () => links.classList.remove("open"));

    document.getElementById("fontesBtn").addEventListener("click", () => {
      cur = {
        id: "fontes", slides: [{
          img: "assets/still.jpg", kicker: "Fontes", title: "De onde veio esta aula.",
          lead: "Treino. Não é receita. Se o protocolo da casa for diferente, vale o da casa.",
          do: ["CFMV 1.260/2019 — o auxiliar trabalha sob orientação.", "Merck Veterinary Manual — triagem, trauma, opioides, convulsão (2025–2026).", "UC Davis CVET — sinais vitais (fev. 2026).", "ACVECC VetATLS — politrauma.", "Clinician’s Brief — fratura aberta, cefazolina, AINE só depois de estável."],
          dont: ["Não use esta aula como receita.", "Não aplique remédio sem a ordem do veterinário."]
        }]
      };
      idx = 0;
      links.classList.remove("open");
      story.classList.add("on");
      if (window.matchMedia("(max-width: 899px)").matches) document.getElementById("mapa").style.display = "none";
      draw();
    });

    let dragX = null;
    document.getElementById("photo").addEventListener("pointerdown", e => { dragX = e.clientX; });
    document.getElementById("photo").addEventListener("pointerup", e => {
      if (dragX == null || !story.classList.contains("on")) return;
      const dx = e.clientX - dragX;
      dragX = null;
      if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    });
    addEventListener("keydown", e => {
      if (!story.classList.contains("on")) return;
      if (e.key === "Escape") closeStory();
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
    });

    function fromHash() {
      const id = (location.hash || "#mapa").slice(1);
      if (!id || id === "mapa" || id === "topo") {
        if (story.classList.contains("on")) {
          story.classList.remove("on");
          story.setAttribute("aria-hidden", "true");
          document.getElementById("mapa").style.display = "";
          sheet.classList.remove("on");
          cur = null;
        }
        return;
      }
      if (cur && cur.id === id && story.classList.contains("on")) return;
      openStation(id, 0, false);
    }
    addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
